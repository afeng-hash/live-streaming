  data:
    redis:
      port: 6379
      host: 192.168.10.128
      lettuce:
        pool:
          min-idle: 10
          max-idle: 20
          max-active: 50
dubbo:
  application:
    name: ${spring.application.name}

  registry:
    address: nacos://192.168.10.128:8848?namespace=afeng-live-test
  protocol:
    name: dubbo
    port: 9099
  consumer:
    timeout: 3000
    retries: 0



rocketmq:
  rmq:
    producer:
      nameSrv: 192.168.10.128:9876
      groupName: ${spring.application.name}
      retryTimes: 3
      sendTimeout: 3000
    consumer:
      nameSrv: 192.168.10.128:9876
      groupName: ${spring.application.name}